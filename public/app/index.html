<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="Bars, Restaurants und Clubs in deiner Umgebung – mit Bewertungen, Kontaktdaten, Social Media, Bildern und Preisen."
    />
    <title>In der Umgebung – Bars, Restaurants &amp; Clubs</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">◉</span>
          <span class="brand__text">In der Umgebung</span>
        </div>

        <button id="locate" class="btn btn--ghost" type="button">
          <span aria-hidden="true">⌖</span> Mein Standort
        </button>
      </div>

      <div class="topbar__row topbar__row--controls">
        <div class="field field--grow">
          <span class="field__icon" aria-hidden="true">⌕</span>
          <input
            id="search"
            class="field__input"
            type="search"
            placeholder="Name, Küche oder Stadtteil suchen"
            autocomplete="off"
            aria-label="Suche"
          />
        </div>

        <label class="field" for="area">
          <span class="field__icon" aria-hidden="true">⌂</span>
          <select id="area" class="field__input" aria-label="Standort wählen"></select>
        </label>
      </div>

      <div class="chips" role="group" aria-label="Kategorie">
        <button class="chip is-active" type="button" data-kind="all">Alle</button>
        <button class="chip" type="button" data-kind="restaurant">🍽️ Restaurants</button>
        <button class="chip" type="button" data-kind="bar">🍸 Bars</button>
        <button class="chip" type="button" data-kind="club">🎧 Clubs</button>
      </div>

      <div class="topbar__row topbar__row--controls">
        <label class="field" for="radius">
          <span class="field__label">Umkreis</span>
          <select id="radius" class="field__input">
            <option value="1">1 km</option>
            <option value="2">2 km</option>
            <option value="5" selected>5 km</option>
            <option value="10">10 km</option>
            <option value="25">25 km</option>
            <option value="">egal</option>
          </select>
        </label>

        <label class="field" for="sort">
          <span class="field__label">Sortieren</span>
          <select id="sort" class="field__input">
            <option value="distance" selected>Entfernung</option>
            <option value="rating">Bewertung</option>
            <option value="price-asc">Preis aufsteigend</option>
            <option value="price-desc">Preis absteigend</option>
          </select>
        </label>

        <label class="switch" for="open-now">
          <input id="open-now" type="checkbox" />
          <span>Jetzt geöffnet</span>
        </label>
      </div>
    </header>

    <main>
      <p id="status" class="status" role="status"></p>
      <div id="results" class="grid"></div>
    </main>

    <div id="detail" class="sheet" hidden>
      <div class="sheet__backdrop" data-close="true"></div>
      <article class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button class="sheet__close" type="button" data-close="true" aria-label="Schließen">✕</button>
        <div id="detail-body"></div>
      </article>
    </div>

    <script src="/app/app.js"></script>
  </body>
</html>
